<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Mes con detalle al lado</title>
<style>
/* Tokens copied from src/index.css (@theme). Only --color-appt / --color-on-appt are new. */
:root{
  --color-background:#f2f4f7;
  --color-surface-container-lowest:#ffffff;
  --color-surface-container-low:#f7f8fa;
  --color-surface-container:#eceef2;
  --color-on-surface:#0f172a;
  --color-on-surface-variant:#45464d;
  --color-outline:#767b85;
  --color-outline-variant:#c9cdd4;
  --color-fill:rgb(15 23 42 / 0.06);
  --color-fill-strong:rgb(15 23 42 / 0.08);
  --color-separator:rgb(15 23 42 / 0.08);
  --color-focus:#0b57d0;
  --color-now:#d70015;
  --color-primary:#0f172a;
  --color-on-primary:#ffffff;
  --color-primary-container:#1e293b;
  --color-secondary-container:#fff4d6;
  --color-on-secondary-fixed:#6b4a00;
  --color-success-container:#e3f5e9;
  --color-on-success-container:#0b5b2a;
  --color-error:#c4001a;
  --color-on-error:#ffffff;
  --color-error-container:#fdecec;
  --color-on-error-container:#9b0014;
  /* New: "Cita por recibir", same family as the focus blue, ink passes AA on the tint. */
  --color-appt:#e7efff;
  --color-on-appt:#0a3f9c;
  --shadow-card:0 1px 2px rgb(15 23 42 / 0.05), 0 8px 24px rgb(15 23 42 / 0.06);
  --radius-lg:0.875rem;
  --radius-xl:1rem;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-background);color:var(--color-on-surface);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd,ol{margin:0;padding:0}
ol{list-style:none}
button,input{font:inherit;color:inherit;margin:0}
button{background:transparent;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* index.css @layer base */
:where(button,a){-webkit-tap-highlight-color:transparent}
:where(button:not(:disabled),a):active{scale:.98}
:where(button,a,input):focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  :where(button,a):active{scale:none}
  *{transition:none!important}
}

/* Type scale (index.css --text-*) */
.t-display{font-size:40px;line-height:42px;letter-spacing:-.025em;font-weight:800}
.t-headline-lg{font-size:24px;line-height:30px;letter-spacing:-.015em;font-weight:800}
.t-headline-md{font-size:20px;line-height:26px;letter-spacing:-.01em;font-weight:700}
.t-title-md{font-size:17px;line-height:22px;font-weight:600}
.t-body-lg{font-size:17px;line-height:24px;font-weight:400}
.t-body-md{font-size:15px;line-height:20px;font-weight:400}
.t-label-lg{font-size:14px;line-height:18px;letter-spacing:.01em;font-weight:700}
.t-label-tech{font-size:12px;line-height:16px;letter-spacing:.08em;font-weight:800;text-transform:uppercase}
.variant{color:var(--color-on-surface-variant)}
.tnum{font-variant-numeric:tabular-nums}

/* Icon: Material Symbols Outlined at 24px, drawn as inline SVG. */
.icon{width:24px;height:24px;flex:none;fill:currentColor;display:block}
.icon-sm{width:18px;height:18px}

/* ---------- AdminShell ---------- */
.shell-aside{position:fixed;inset:0 auto 0 0;width:288px;display:flex;flex-direction:column;gap:28px;
  border-right:1px solid var(--color-separator);background:var(--color-surface-container-lowest);padding:28px 16px 20px}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px}
.brand-glyph{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;
  background:var(--color-primary);color:var(--color-on-primary)}
.nav{display:flex;flex:1;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;border-radius:var(--radius-lg);
  font-size:17px;line-height:22px;font-weight:600;color:var(--color-on-surface);transition:background-color .15s}
.nav a:hover{background:var(--color-fill)}
.nav a[aria-current=page]{background:var(--color-primary);color:var(--color-on-primary);font-weight:700}
.identity{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--color-separator);padding-top:14px}
.identity-row{display:flex;align-items:center;gap:12px;padding:0 12px}
.avatar{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;
  background:var(--color-fill-strong);font-size:14px;line-height:18px;font-weight:800}
main{margin-left:288px}

/* ---------- PageFrame ---------- */
.page{max-width:1080px;margin:0 auto;padding:40px 32px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-actions{display:flex;gap:12px}

/* ---------- Button (button-classes.ts) ---------- */
.btn{display:flex;min-height:56px;align-items:center;justify-content:center;gap:4px;border-radius:var(--radius-lg);
  padding:0 16px;font-size:17px;line-height:22px;font-weight:700;transition:background-color .15s;white-space:nowrap}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn-primary:hover{background:var(--color-primary-container)}
.btn-secondary{background:var(--color-fill);color:var(--color-on-surface)}
.btn-secondary:hover{background:var(--color-fill-strong)}
.btn-danger{background:var(--color-error);color:var(--color-on-error)}
.btn-danger:hover{background:var(--color-on-error-container)}
.btn-subtle-danger{background:var(--color-surface-container-lowest);color:var(--color-error)}
.btn-subtle-danger:hover{background:var(--color-error-container)}

/* ---------- SegmentedControl ---------- */
.seg{display:flex;align-self:flex-start;border-radius:13px;background:var(--color-fill);padding:3px}
.seg button{min-height:48px;min-width:104px;border-radius:10px;padding:0 18px;font-size:15px;line-height:20px;
  font-weight:600;color:var(--color-on-surface-variant);transition:color .15s}
.seg button:hover{color:var(--color-on-surface)}
.seg button[aria-pressed=true]{background:var(--color-surface-container-lowest);font-weight:800;color:var(--color-on-surface);
  box-shadow:0 1px 3px rgb(15 23 42 / 0.14)}

/* ---------- OrdersView toolbar + TicketSearch ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.search{display:flex;min-width:0;flex:1 1 20rem;flex-direction:column;gap:4px}
.search-row{display:flex;gap:8px}
.search-field{display:flex;min-height:56px;min-width:0;flex:1;align-items:center;gap:10px;border-radius:var(--radius-lg);
  border:2px solid var(--color-outline);background:var(--color-surface-container-lowest);padding:0 14px;color:var(--color-on-surface-variant)}
.search-field:has(input:focus-visible){outline:3px solid var(--color-focus);outline-offset:2px}
.search-field input{min-width:0;flex:1;background:transparent;border:0;outline:none;font-size:17px;line-height:24px;
  font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-on-surface)}
.search-field input::placeholder{color:var(--color-on-surface-variant)}
.search-error{color:var(--color-error)}
.notice{border-radius:var(--radius-xl);background:var(--color-success-container);padding:16px 20px;
  font-size:17px;line-height:22px;font-weight:600;color:var(--color-on-success-container)}

/* ---------- Month header (DayView header + DayChanger) ---------- */
.month-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.changer{display:flex;flex-shrink:0;align-items:stretch;border-radius:var(--radius-lg);background:var(--color-surface-container-lowest);
  box-shadow:0 0 0 1px var(--color-separator)}
.changer button{display:flex;min-height:48px;align-items:center;justify-content:center;gap:2px;padding:0 16px;
  font-size:17px;line-height:24px;font-weight:600;white-space:nowrap;color:var(--color-on-surface);transition:background-color .15s}
.changer button:first-child{border-radius:var(--radius-lg) 0 0 var(--radius-lg)}
.changer button:last-child{border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.changer button:hover{background:var(--color-fill)}
.changer button:disabled{color:var(--color-outline)}
.changer button:disabled:hover{background:transparent}
.changer-divider{margin:10px 0;width:1px;background:var(--color-fill-strong)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0}

/* ---------- Split: calendar beside the detail (@3xl:flex-row, gap-7) ---------- */
.split{display:flex;align-items:flex-start;gap:28px}
.cal{min-width:0;flex:1;overflow:hidden;border-radius:var(--radius-xl);background:var(--color-surface-container-lowest)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekday{padding:12px 8px 10px;text-align:left;border-bottom:1px solid var(--color-separator)}
.day{display:flex;min-height:116px;min-width:0;flex-direction:column;gap:3px;padding:6px 4px 8px;
  border-top:1px solid var(--color-separator);border-left:1px solid var(--color-separator)}
.day:nth-child(7n+1){border-left:0}
.cal-grid .day.first-row{border-top:0}
.day.out{background:var(--color-surface-container-low)}
.day-num{display:flex;align-items:center;justify-content:center;align-self:flex-start;min-width:30px;height:30px;padding:0 6px;
  border-radius:999px;font-size:15px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--color-on-surface);transition:background-color .15s}
.day-num:hover{background:var(--color-fill)}
.day.out .day-num{color:var(--color-outline);font-weight:600}
.day.today .day-num{background:var(--color-now);color:#fff;font-weight:800}
.day-state{display:flex;align-items:center;gap:3px;padding:0 4px;font-size:12px;line-height:18px;font-weight:700;color:var(--color-on-surface-variant)}

/* Chip: OrderRows' StatusChip (rounded-full, label-lg extrabold), sized down for the grid. */
.chip{display:flex;align-items:center;gap:2px;width:100%;min-width:0;border-radius:999px;padding:2px 7px;text-align:left;
  font-size:12px;line-height:17px;letter-spacing:0;font-weight:800;white-space:nowrap;transition:filter .15s}
.chip-text{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip .icon{width:14px;height:14px;margin-left:-2px}
.legend .chip{width:auto;padding:4px 10px;font-size:14px;line-height:18px;letter-spacing:.01em}
.legend .chip .icon{width:16px;height:16px}
.chip:hover{filter:brightness(.97)}
.chip-appt{background:var(--color-appt);color:var(--color-on-appt)}
.chip-order{background:var(--color-secondary-container);color:var(--color-on-secondary-fixed)}
.chip-ready{background:var(--color-success-container);color:var(--color-on-success-container)}
.chip-done{background:var(--color-fill);color:var(--color-on-surface)}
.chip[aria-current=true]{box-shadow:inset 0 0 0 2px var(--color-primary)}
.more{align-self:flex-start;border-radius:999px;padding:2px 8px;font-size:12px;line-height:17px;font-weight:800;
  color:var(--color-on-surface-variant)}
.more:hover{background:var(--color-fill)}

/* ---------- Detail (AppointmentDetail / OrderDetail) ---------- */
.detail{display:flex;width:360px;flex-shrink:0;min-width:0;flex-direction:column;gap:16px}
.hint{border-radius:var(--radius-xl);background:var(--color-surface-container-lowest);padding:24px;color:var(--color-on-surface-variant)}
.card{display:flex;flex-direction:column;border-radius:22px;background:var(--color-surface-container-lowest);padding:24px;box-shadow:var(--shadow-card)}
.gap-16{gap:16px}.gap-20{gap:20px}
.stack{display:flex;flex-direction:column}
.ticket{align-self:flex-start;border-radius:var(--radius-lg);background:var(--color-fill);padding:4px 10px;
  font-size:15px;line-height:20px;font-weight:800;letter-spacing:.025em;font-variant-numeric:tabular-nums}
.facts-appt{display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--color-background)}
.facts-appt .fact-work{display:flex;flex-direction:column;gap:2px;padding:12px 16px}
.facts-appt .fact{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--color-separator);padding:12px 16px}
.facts-appt .fact dt{font-size:15px;line-height:20px;font-weight:600}
.facts-appt dd,.facts-order dd{font-size:17px;line-height:22px;font-weight:800;font-variant-numeric:tabular-nums}
.facts-order{display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--color-surface-container-lowest)}
.facts-order .fact{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--color-separator);padding:14px 20px}
.facts-order .fact:first-child{border-top:0}
.facts-order dt{font-size:17px;line-height:24px;font-weight:500}
.facts-order dd{text-align:right}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress li{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:999px;background:var(--color-outline-variant)}
.bar.on{background:var(--color-primary)}
.step-label{font-size:14px;line-height:18px;letter-spacing:.01em;font-weight:500;color:var(--color-on-surface-variant)}
.step-label.current{font-weight:800;color:var(--color-on-surface)}
.row-actions{display:flex;flex-wrap:wrap;gap:10px}
.row-actions .btn{flex:1 1 auto}
.confirm{display:flex;flex-direction:column;gap:8px;border-radius:var(--radius-xl);padding:16px}
.confirm-danger{background:var(--color-error-container);color:var(--color-on-error-container)}
.confirm-neutral{background:var(--color-surface-container);color:var(--color-on-surface)}
.confirm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-buttons .btn{white-space:normal;text-align:center;padding:0 12px}

.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}

/* Below the split width the detail is its own block under the calendar. */
@media (max-width:1180px){
  .split{flex-direction:column;align-items:stretch}
  .detail{width:auto}
}
@media (max-width:767px){
  .shell-aside{display:none}
  main{margin-left:0}
  .page{padding:24px 16px}
  .t-display{font-size:34px;line-height:38px;letter-spacing:-.02em}
  .day{min-height:76px}
  .chip{font-size:0;height:6px;padding:0}
}
</style>
</head>

<script>
// ---------- Data: October 2026, today Saturday 24 at 11:05 (Cancún). ----------
const TODAY = '2026-10-24';
const NOW_TIME = '11:05';
const BLOCKED = ['2026-10-12'];

const appointments = [
  {id:'a1', date:'2026-10-05', time:'10:00', clientName:'Lucía Gómez',  ticket:'4512', services:['Ajuste de cintura'],            quote:180, whatsapp:'9981234567'},
  {id:'a2', date:'2026-10-14', time:'11:30', clientName:'Elena Díaz',   ticket:'4602', services:['Dobladillo de falda'],          quote:150, whatsapp:'9987654321'},
  {id:'a3', date:'2026-10-24', time:'10:30', clientName:'Ana Martínez', ticket:'4821', services:['Ajuste de vestido de fiesta'],  quote:450, whatsapp:'9981112233'},
  {id:'a4', date:'2026-10-24', time:'12:00', clientName:'Juan Pérez',   ticket:'4830', services:['Bastilla de pantalón'],         quote:120, whatsapp:'9984445566'},
  {id:'a5', date:'2026-10-24', time:'16:30', clientName:'Elena Díaz',   ticket:'4841', services:['Dobladillo de falda'],          quote:150},
  {id:'a6', date:'2026-10-27', time:'09:30', clientName:'Lucía Gómez',  ticket:'4855', services:['Ajuste de cintura'],            quote:180, whatsapp:'9981234567'},
  {id:'a7', date:'2026-10-30', time:'13:00', clientName:'Carlos Ruiz',  ticket:'4870', services:['Ajuste de saco', 'Cambio de botones'], quote:390, whatsapp:'9983332211'},
];
const orders = [
  {id:'o1', deliveryDate:'2026-10-06', status:'delivered',  clientName:'Juan Pérez',   ticket:'3390', work:'Parche',                        price:90,   whatsapp:'9984445566'},
  {id:'o2', deliveryDate:'2026-10-16', status:'cancelled',  clientName:'María López',  ticket:'2210', work:'Cambio de cierre de chamarra',  price:220},
  {id:'o3', deliveryDate:'2026-10-24', status:'ready',      clientName:'Carlos Ruiz',  ticket:'7720', work:'Ajuste de saco',                price:350,  whatsapp:'9983332211'},
  {id:'o4', deliveryDate:'2026-10-26', status:'inProgress', clientName:'María López',  ticket:'6105', work:'Ajuste de vestido de novia',    price:1800, whatsapp:'9985556677'},
  {id:'o5', deliveryDate:'2026-10-28', status:'received',   clientName:'Juan Pérez',   ticket:'7741', work:'Bastilla de pantalón',          price:120,  whatsapp:'9984445566'},
  {id:'o6', deliveryDate:'2026-10-28', status:'onTheWay',   clientName:'Ana Martínez', ticket:'7702', work:'Cambio de cierre de chamarra',  price:220,  whatsapp:'9981112233'},
];

// ---------- Labels: src/orders/ui/order-labels.ts ----------
const ORDER_STEPS = ['received','inProgress','ready','delivered'];
const STEP_LABELS = {received:'Recibido', inProgress:'En proceso', ready:'Listo', delivered:'Entregado'};
const STATUS_LABELS = {received:'Recibido', inProgress:'En proceso', ready:'Listo para recoger', onTheWay:'Cliente en camino', delivered:'Entregado', cancelled:'Cancelado'};
const ACTIONS_TO_REACH = {received:'Marcar como recibido', inProgress:'Empezar a trabajar', ready:'Marcar como listo', delivered:'Marcar como entregado'};

// ---------- Domain helpers: src/orders/domain/order.ts ----------
const isActive = (o) => o.status !== 'delivered' && o.status !== 'cancelled';
const isReadyForPickup = (o) => o.status === 'ready' || o.status === 'onTheWay';
const stepOf = (s) => s === 'onTheWay' ? 'ready' : s;
function nextStatus(s){ if (s === 'cancelled') return undefined; return ORDER_STEPS[ORDER_STEPS.indexOf(stepOf(s)) + 1]; }
function previousStatus(s){
  if (s === 'cancelled' || s === 'delivered') return undefined;
  if (s === 'onTheWay') return 'ready';
  return ORDER_STEPS[ORDER_STEPS.indexOf(s) - 1];
}

// ---------- Format: src/shared/ui/format.ts ----------
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PESOS = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:0});
const formatPesos = (n) => `${PESOS.format(n)} MXN`;
const capitalize = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const utc = (iso) => new Date(iso + 'T00:00:00Z');
function formatLongDate(iso){ const d = utc(iso); return `${WEEKDAYS[d.getUTCDay()]} ${d.getUTCDate()} de ${MONTHS[d.getUTCMonth()]}`; }
const formatDayLabel = (iso) => iso === TODAY ? `Hoy, ${formatLongDate(iso)}` : capitalize(formatLongDate(iso));
const formatWhatsapp = (n) => `${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6)}`;
const formatCount = (c, one, many) => `${c} ${c === 1 ? one : many}`;
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (name, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

// ---------- State ----------
const state = {year:2026, month:9, what:'all', ordersFilter:'workshop', chosen:undefined, confirming:undefined, expanded:undefined};

function calendarEntries(){
  const entries = [];
  if (state.what !== 'order') {
    appointments.forEach((a) => entries.push({kind:'appt', id:a.id, date:a.date, sort:'0' + a.time, item:a}));
  }
  if (state.what !== 'appt') {
    orders.forEach((o) => {
      const wanted = state.what === 'all' ? isActive(o) : (state.ordersFilter === 'finished' ? !isActive(o) : isActive(o));
      if (wanted) entries.push({kind:'order', id:o.id, date:o.deliveryDate, sort:'1' + o.ticket, item:o});
    });
  }
  return entries.sort((x, y) => x.sort.localeCompare(y.sort));
}

function chipClass(e){
  if (e.kind === 'appt') return 'chip-appt';
  if (!isActive(e.item)) return 'chip-done';
  return isReadyForPickup(e.item) ? 'chip-ready' : 'chip-order';
}
// The type is in the chip, not only in its color: a cita starts with its time, a
// delivery with the order glyph and its ticket. The full words are in title and aria-label.
function chipText(e){
  const i = e.item;
  if (e.kind === 'appt') return `${i.time} ${i.clientName}`;
  return `${i.ticket} ${i.clientName}`;
}
function chipTitle(e){
  const i = e.item;
  if (e.kind === 'appt') return `Cita ${i.time} · ${i.clientName}`;
  return `Entrega ${i.ticket} · ${i.clientName} · ${STATUS_LABELS[i.status]}`;
}
function chipLabel(e){
  const i = e.item;
  if (e.kind === 'appt') return `Cita por recibir, ${i.time}, ${i.clientName}, ticket ${i.ticket}`;
  return `Entrega del pedido ${i.ticket}, ${i.clientName}, ${STATUS_LABELS[i.status]}`;
}

// ---------- Counts line (OrdersView workshopSummary) ----------
function renderCounts(){
  const inWorkshop = orders.filter(isActive);
  const ready = inWorkshop.filter(isReadyForPickup).length;
  let summary = `${inWorkshop.length} en el taller`;
  if (ready > 0) summary += ` · ${formatCount(ready, 'listo para recoger', 'listos para recoger')}`;
  document.getElementById('counts').textContent = summary;
}

// ---------- Legend ----------
function renderLegend(){
  const rows = [];
  if (state.what !== 'order') rows.push(['chip-appt', '', 'Cita por recibir']);
  const showActive = state.what === 'all' || (state.what === 'order' && state.ordersFilter === 'workshop');
  if (showActive) {
    rows.push(['chip-order', icon('checkroom'), 'Entrega de pedido']);
    rows.push(['chip-ready', icon('checkroom'), 'Listo para recoger o cliente en camino']);
  }
  if (state.what === 'order' && state.ordersFilter === 'finished') rows.push(['chip-done', icon('checkroom'), 'Pedido terminado']);
  document.getElementById('legend').innerHTML = rows.map(([cls, glyph, label]) =>
    `<li><span class="chip ${cls}">${glyph}<span class="chip-text">${label}</span></span></li>`
  ).join('');
}

// ---------- Month grid (Monday first) ----------
function renderWeekdays(){
  document.getElementById('weekdays').innerHTML = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']
    .map((d) => `<div class="weekday t-label-lg variant">${d}</div>`).join('');
}

function renderGrid(){
  const {year, month} = state;
  const title = `${capitalize(MONTHS[month])} ${year}`;
  document.getElementById('month-title').textContent = title;
  const isCurrentMonth = TODAY.startsWith(iso(year, month, 1).slice(0, 7));
  document.getElementById('this-month').disabled = isCurrentMonth;

  const first = new Date(Date.UTC(year, month, 1));
  const lead = (first.getUTCDay() + 6) % 7;
  const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const total = Math.ceil((lead + daysInMonth) / 7) * 7;
  const entries = calendarEntries();

  let html = '';
  for (let i = 0; i < total; i++) {
    const d = new Date(Date.UTC(year, month, 1 - lead + i));
    const date = d.toISOString().slice(0, 10);
    const out = d.getUTCMonth() !== month;
    const isToday = date === TODAY;
    const isSunday = d.getUTCDay() === 0;
    const isBlocked = BLOCKED.includes(date);
    const classes = ['day', out ? 'out' : '', isToday ? 'today' : '', i < 7 ? 'first-row' : ''].join(' ');
    const longDate = formatLongDate(date);
    let cell = `<div class="${classes}" role="group" aria-label="${capitalize(longDate)}">`;
    cell += `<button type="button" class="day-num" data-day="${date}" aria-label="Abrir el ${longDate}${isToday ? ', hoy' : ''}">${d.getUTCDate()}</button>`;
    if (isBlocked) cell += `<span class="day-state">${icon('lock', 'icon-sm')}Bloqueado</span>`;
    else if (isSunday) cell += `<span class="day-state">Cerrado</span>`;
    if (!out) {
      const dayEntries = entries.filter((e) => e.date === date);
      // A chosen entry past the third one keeps its day open, so the chip stays in sight.
      const isOpen = state.expanded === date || dayEntries.slice(3).some((e) => e.id === state.chosen);
      const shown = isOpen ? dayEntries : dayEntries.slice(0, 3);
      shown.forEach((e) => {
        const isChosen = state.chosen === e.id;
        const glyph = e.kind === 'order' ? icon('checkroom') : '';
        cell += `<button type="button" class="chip ${chipClass(e)}" data-id="${e.id}" title="${esc(chipTitle(e))}" aria-label="${esc(chipLabel(e))}"${isChosen ? ' aria-current="true"' : ''}>${glyph}<span class="chip-text">${esc(chipText(e))}</span></button>`;
      });
      if (dayEntries.length > 3 && !isOpen) {
        cell += `<button type="button" class="more" data-more="${date}" aria-label="Ver ${dayEntries.length - 3} más del ${longDate}">${dayEntries.length - 3} más</button>`;
      }
    }
    cell += '</div>';
    html += cell;
  }
  document.getElementById('grid').innerHTML = html;
}

// ---------- Detail panel ----------
function findChosen(){
  const visible = calendarEntries().find((e) => e.id === state.chosen);
  return visible;
}

function hasStarted(a){ return a.date < TODAY || (a.date === TODAY && a.time <= NOW_TIME); }

function confirmPanel(tone, question, confirmLabel, keepLabel){
  const confirmVariant = tone === 'neutral' ? 'btn-primary' : 'btn-danger';
  return `<div class="confirm confirm-${tone}">
    <p class="t-title-md">${esc(question)}</p>
    <div class="confirm-buttons">
      <button type="button" class="btn ${confirmVariant}" data-act="confirm">${confirmLabel}</button>
      <button type="button" class="btn btn-secondary" data-act="keep">${keepLabel}</button>
    </div></div>`;
}

// src/agenda/ui/day/AppointmentDetail.tsx
function appointmentDetail(a){
  const canChange = !hasStarted(a);
  const reminder = canChange && a.whatsapp
    ? `<a class="btn btn-primary" href="#" data-act="remind">${icon('chat')}Recordar por WhatsApp</a>` : '';
  const cancel = !canChange ? '' : state.confirming === 'cancel-appt'
    ? confirmPanel('danger', `¿Cancelar la cita de ${a.clientName} a las ${a.time}?`, 'Sí, cancelar la cita', 'No, dejarla')
    : `<button type="button" class="btn btn-subtle-danger" data-act="ask-cancel-appt">${icon('event_busy')}Cancelar cita</button>`;
  return `
    <div class="card gap-16">
      <div class="stack" style="gap:6px">
        <p class="t-body-md variant" style="font-weight:700">Cita de las ${a.time}</p>
        <h3 class="t-headline-lg">${esc(a.clientName)}</h3>
        <span class="ticket" style="margin-top:4px">Ticket ${a.ticket}</span>
      </div>
      <dl class="facts-appt">
        <div class="fact-work"><dt class="t-label-lg variant">Trabajo</dt><dd class="t-title-md" style="font-weight:600">${esc(a.services.join(', '))}</dd></div>
        <div class="fact"><dt>Cotización preliminar</dt><dd>${formatPesos(a.quote)}</dd></div>
        <div class="fact"><dt>WhatsApp</dt><dd>${a.whatsapp ? formatWhatsapp(a.whatsapp) : 'No dejó número'}</dd></div>
      </dl>
      ${reminder}
    </div>
    ${cancel}`;
}

// src/orders/ui/list/OrderDetail.tsx
function orderDetail(o){
  const active = isActive(o);
  let progress = '';
  if (o.status !== 'cancelled') {
    const current = ORDER_STEPS.indexOf(stepOf(o.status));
    progress = `<ol class="progress" aria-label="Avance del pedido">${ORDER_STEPS.map((s, i) =>
      `<li${i === current ? ' aria-current="step"' : ''}><span class="bar${i <= current ? ' on' : ''}" aria-hidden="true"></span><span class="step-label${i === current ? ' current' : ''}">${STEP_LABELS[s]}</span></li>`
    ).join('')}</ol>`;
  }
  let forward = '';
  const next = active ? nextStatus(o.status) : undefined;
  if (next) {
    if (state.confirming === 'deliver') {
      forward = confirmPanel('neutral', `¿Entregar el pedido de ${o.clientName}?`, 'Sí, entregar el pedido', 'No, todavía no');
    } else {
      let notice = '';
      if (o.status === 'ready') {
        notice = o.whatsapp
          ? `<a class="btn btn-secondary" href="#" data-act="notify">${icon('chat')}Avisar por WhatsApp</a>`
          : `<p class="t-body-md variant" style="text-align:center;font-weight:600">No dejó WhatsApp para avisarle.</p>`;
      }
      forward = `<div class="stack" style="gap:8px"><button type="button" class="btn btn-primary" data-act="forward">${icon('check')}${ACTIONS_TO_REACH[next]}</button>${notice}</div>`;
    }
  }
  let back = '';
  if (active) {
    const previous = previousStatus(o.status);
    back = state.confirming === 'cancel-order'
      ? confirmPanel('danger', `¿Cancelar el pedido de ${o.clientName}?`, 'Sí, cancelar el pedido', 'No, seguir con el pedido')
      : `<div class="row-actions">
          ${previous ? `<button type="button" class="btn btn-secondary" data-act="back">${icon('undo')}Regresar a ${STEP_LABELS[previous]}</button>` : ''}
          <button type="button" class="btn btn-subtle-danger" data-act="ask-cancel-order">${icon('close')}Cancelar pedido</button>
        </div>`;
  }
  return `
    <div class="card gap-20">
      <div class="stack" style="gap:6px">
        <span class="ticket">Ticket ${o.ticket}</span>
        <h3 class="t-headline-lg" style="margin-top:4px">${esc(o.clientName)}</h3>
        <p class="t-body-md variant" style="font-weight:600">${esc(o.work)}</p>
        <p class="t-headline-md" style="margin-top:8px">${STATUS_LABELS[o.status]}</p>
      </div>
      ${progress}
      ${forward}
    </div>
    <dl class="facts-order">
      <div class="fact"><dt>Entrega</dt><dd>${formatDayLabel(o.deliveryDate)}</dd></div>
      <div class="fact"><dt>Total, se paga en el taller</dt><dd>${formatPesos(o.price)}</dd></div>
    </dl>
    ${back}`;
}

function renderDetail(){
  const panel = document.getElementById('detail');
  const entry = findChosen();
  if (!entry) {
    panel.setAttribute('aria-label', 'Detalle');
    panel.innerHTML = `<p class="hint">Elige una cita o un pedido del calendario para ver su detalle.</p>`;
    return;
  }
  panel.setAttribute('aria-label', entry.kind === 'appt' ? 'Detalle de la cita' : 'Detalle del pedido');
  panel.innerHTML = entry.kind === 'appt' ? appointmentDetail(entry.item) : orderDetail(entry.item);
}

function render(){
  renderCounts();
  renderLegend();
  renderGrid();
  renderDetail();
}

// ---------- Notice (OrdersView FinishedNotice) ----------
function showNotice(text){
  const el = document.getElementById('notice');
  el.className = text ? 'notice mt-16' : 'sr-only';
  el.textContent = text || '';
}

// ---------- Events ----------
function choose(id){
  state.chosen = id;
  state.confirming = undefined;
  showNotice();
  render();
  const chip = document.querySelector(`.chip[data-id="${id}"]`);
  if (chip) chip.focus();
}

document.getElementById('grid').addEventListener('click', (event) => {
  const chip = event.target.closest('.chip');
  if (chip) return choose(chip.dataset.id);
  // "N más" opens the rest of that day in place.
  const more = event.target.closest('.more');
  if (more) {
    const date = more.dataset.more;
    state.expanded = date;
    render();
    const fourth = document.querySelectorAll(`.day-num[data-day="${date}"] ~ .chip`)[3];
    if (fourth) fourth.focus();
  }
});

function moveOrder(o, status){
  o.status = status;
  state.confirming = undefined;
  if (!isActive(o)) {
    state.chosen = undefined;
    showNotice(`Pedido de ${o.clientName} ${status === 'delivered' ? 'entregado' : 'cancelado'}. Lo encuentras en Terminados.`);
  }
  render();
}

document.getElementById('detail').addEventListener('click', (event) => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const entry = findChosen();
  if (!entry) return;
  const act = target.dataset.act;
  const item = entry.item;
  if (act === 'remind' || act === 'notify') { event.preventDefault(); return; }
  if (act === 'ask-cancel-appt') state.confirming = 'cancel-appt';
  else if (act === 'ask-cancel-order') state.confirming = 'cancel-order';
  else if (act === 'keep') state.confirming = undefined;
  else if (act === 'forward') {
    const next = nextStatus(item.status);
    if (next === 'delivered') state.confirming = 'deliver';
    else return moveOrder(item, next);
  }
  else if (act === 'back') return moveOrder(item, previousStatus(item.status));
  else if (act === 'confirm') {
    if (state.confirming === 'cancel-appt') {
      appointments.splice(appointments.indexOf(item), 1);
      state.chosen = undefined;
      state.confirming = undefined;
    } else if (state.confirming === 'cancel-order') return moveOrder(item, 'cancelled');
    else if (state.confirming === 'deliver') return moveOrder(item, 'delivered');
  }
  render();
});

function wireSegmented(id, onChange){
  const group = document.getElementById(id);
  group.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    onChange(button.dataset.value);
  });
}
// Mes is the only view drawn in this artboard; Semana and Día are the current screens.
wireSegmented('seg-view', () => {});
wireSegmented('seg-what', (value) => {
  state.what = value;
  document.getElementById('seg-orders').hidden = value !== 'order';
  state.chosen = undefined; state.confirming = undefined; showNotice(); render();
});
wireSegmented('seg-orders', (value) => {
  state.ordersFilter = value;
  state.chosen = undefined; state.confirming = undefined; showNotice(); render();
});

document.getElementById('prev-month').addEventListener('click', () => {
  state.month -= 1; if (state.month < 0) { state.month = 11; state.year -= 1; } render();
});
document.getElementById('next-month').addEventListener('click', () => {
  state.month += 1; if (state.month > 11) { state.month = 0; state.year += 1; } render();
});
document.getElementById('this-month').addEventListener('click', () => {
  state.year = 2026; state.month = 9; render();
  document.getElementById('prev-month').focus();
});

// TicketSearch: four digits, then the order or appointment with that ticket opens.
document.getElementById('search').addEventListener('submit', (event) => {
  event.preventDefault();
  const ticket = document.getElementById('ticket').value.trim();
  const error = document.getElementById('search-error');
  if (!/^\d{4}$/.test(ticket)) { error.textContent = 'Escribe los 4 números del ticket'; error.hidden = false; return; }
  const order = orders.find((o) => o.ticket === ticket);
  const appt = appointments.find((a) => a.ticket === ticket);
  const found = order || appt;
  if (!found) { error.textContent = `No hay ningún pedido con el ticket ${ticket}`; error.hidden = false; return; }
  error.hidden = true;
  // Show everything so the found entry is on the calendar.
  if (order && !isActive(order)) {
    state.what = 'order'; state.ordersFilter = 'finished';
  } else {
    state.what = 'all';
  }
  document.querySelectorAll('#seg-what button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === state.what)));
  document.querySelectorAll('#seg-orders button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === state.ordersFilter)));
  document.getElementById('seg-orders').hidden = state.what !== 'order';
  const date = order ? order.deliveryDate : appt.date;
  state.year = Number(date.slice(0, 4)); state.month = Number(date.slice(5, 7)) - 1;
  choose(found.id);
});

renderWeekdays();
// Review shortcut: #cita or #pedido opens with that entry chosen.
state.chosen = {'#cita':'a6', '#pedido':'o3'}[location.hash];
render();
</script>
</body>
